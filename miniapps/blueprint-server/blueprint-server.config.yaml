# Blueprint server settings, read by src/main.ts.
# Lookup: $BLUEPRINT_SERVER_CONFIG, then blueprint-server.config.yaml / .yml / .json in the working directory, then this module's root.
# Profiles layer blueprint-server.config.<profile>.yaml (and .env.<profile>) over this file, later profiles winning.
# Active profiles: --profile a,b, then $BLUEPRINT_SERVER_PROFILES, $CURATOR_PROFILES, then profiles.active below.
# .env files: this module's, then the workspace root's; variables already set win.
# Any string value may reference the environment as ${VAR} or ${VAR:default}; keep secrets in .env.

# profiles:
#   active: dev

# Passed to createCuratorHost: logLevel
host:
  logLevel: warn

# Google OAuth client ids accepted as id_token `aud`: web client (browser sign-in) and the
# device client the blueprint REPL signs in with. Ids that resolve empty are ignored.
googleClientIds:
  - ${GOOGLE_CLIENT_ID}
  - ${CLIENT_ID_BLUEPRINT}

# Emails (a@x.com) or domains (@x.com) admitted; a list, or a comma-separated string.
allowedEmails: ${BLUEPRINT_ALLOWED_EMAILS}

server:
  port: ${BLUEPRINT_SERVER_PORT:4200}
  host: 127.0.0.1
  publicUrl: ${BLUEPRINT_SERVER_PUBLIC_URL}

# Relative to this module's root.
databasePath: ${BLUEPRINT_SERVER_DB:./data/curator.db}
