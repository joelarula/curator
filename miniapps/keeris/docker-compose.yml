services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: keeris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keeris}
      POSTGRES_USER: ${POSTGRES_USER:-curator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curator_secret}
    volumes:
      - keeris-postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curator} -d ${POSTGRES_DB:-keeris}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  keeris:
    build:
      context: ../..
      dockerfile: miniapps/keeris/Dockerfile
    container_name: keeris-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - keeris-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-curator}:${POSTGRES_PASSWORD:-curator_secret}@postgres:5432/${POSTGRES_DB:-keeris}?schema=public
      - DATABASE_PATH=/app/data/keeris.db
      - CURATOR_DATABASE_PATH=/app/data/curator.db
      - CURATOR_DATABASE_NAME=keeris
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - INDEX_INTERVAL_MS=${INDEX_INTERVAL_MS:-60000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  keeris-data:
    driver: local
  keeris-postgres-data:
    driver: local
