        activeYear:
          type: array
          description: Months of the requested year, each with its episodes.
          items:
            $ref: '#/components/schemas/RadioArchiveMonth'

    RadioArchiveMonth:
      type: object
      description: One calendar month of archive episodes.
      required:
        - dateSeconds
        - data
      properties:
        date:
          type: string
          deprecated: true
          description: |
            Legacy preformatted month label, for example `September 2026`.
            Inconsistent across locales. Do not display. Removed once clients read `dateSeconds`.
          example: September 2026
        dateSeconds:
          type: integer
          format: int64
          description: |
            Unix timestamp in seconds for 00:00 on the 1st of this month in Europe/Tallinn.
            September 2026 is `1788210000`.
          example: 1788210000
        data:
          type: array
          items:
            $ref: '#/components/schemas/RadioArchiveItem'

    RadioArchiveItem:
      type: object
      description: One archived episode row.
      required:
        - id
        - heading
        - combinedTime
      properties:
        id:
          type: integer
          format: int64
        heading:
          type: string
        combinedTime:
          type: integer
          format: int64
          description: Episode start time as Unix seconds.
        photo:
          $ref: '#/components/schemas/RadioArchivePhoto'
        mediaIds:
          type: array
          description: Playback media ids. The API sends them as strings.
          items:
            type: string

    RadioArchivePhoto:
      type: object
      description: Episode image. Only `photoUrlBase` is required for playback and cards.
      required:
        - photoUrlBase
      properties:
        id:
          type: integer
          format: int64
        format:
          type: string
        w:
          type: integer
        h:
          type: integer
        photoUrlBase:
          type: string
          description: Relative or absolute photo path consumed by the player and cards.
        authorEt:
          type: string
        authorRu:
          type: string
        authorEn:
          type: string
        captionEt:
          type: string
        captionEn:
          type: string
        captionRu:
          type: string
        hideCaption:
          type: boolean
        photoAspectRatio:
          type: string
