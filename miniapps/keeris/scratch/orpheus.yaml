            Required by the backend when reCAPTCHA validation is enabled.
        images:
          type: array
          description: Optional image attachments.
          maxItems: 3
          items:
            type: string
            format: binary

    HelpFeedbackSubmitResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/HelpFeedbackSubmitData'

    HelpFeedbackSubmitData:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Backend acknowledgement message for a successful submission.

    HelpFeedbackValidationErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          description: Validation errors keyed to request fields via `source.pointer`.
          items:
            $ref: '#/components/schemas/HelpFeedbackValidationError'

    HelpFeedbackValidationError:
      type: object
      required:
        - status
        - title
        - message
      properties:
        status:
          type: string
          example: '422'
        source:
          $ref: '#/components/schemas/HelpFeedbackErrorSource'
        title:
          type: string
          example: Validation Error
        message:
          type: string
          description: Human-readable Estonian validation message.

    HelpFeedbackErrorSource:
      type: object
      properties:
        pointer:
          type: string
          description: Request field name that caused the validation error.

    HelpFeedbackGenericErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/HelpFeedbackGenericError'

    HelpFeedbackGenericError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable backend error message.
        file:
          type: string
          description: Optional backend source file for debugging.
        line:
          type: integer
          description: Optional backend source line for debugging.

    PollPhoto:
      type: object
      description: Photo metadata for poll, question, or answer images.
      properties:
        id:
          type: integer
          format: int64
        photoUrlBase:
          type: string
          description: Relative crop path (to be prefixed with the photo host).
        captionEt:
          type: string
        captionEn:
          type: string
        captionRu:
          type: string
        authorEt:
          type: string
        authorEn:
          type: string
        authorRu:
          type: string

    Poll:
      type: object
      description: A poll with one or more questions and their answers.
      properties:
        id:
          type: integer
          format: int64
        heading:
          type: string
        description:
          type: string
          nullable: true
        primaryCategoryId:
          type: integer
        displayResults:
          type: string
          enum: [never, after, during]
        onlyResults:
          type: boolean
          description: |
            Voting has ended. Clients show results only and must not offer a vote.
            Missing or non-boolean values mean voting is still open.
        isVoteScheduled:
          type: boolean
        useRecaptcha:
          type: boolean
        showHeading:
          type: boolean
          description: Whether the poll heading is shown on the public site (false when unset).
        voteInterval:
          type: integer
          format: int32
          nullable: true
          description: Vote cooldown in minutes (0 means no cooldown).
        questionCount:
          type: integer
        state:
          type: integer
          description: Poll state/status.
        photo:
          $ref: '#/components/schemas/PollPhoto'
          nullable: true
          description: Poll-level image.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/PollQuestion'
      required:
        - id
        - heading
        - primaryCategoryId
        - displayResults
        - isVoteScheduled
        - useRecaptcha
        - showHeading
        - questionCount
        - questions

    PollQuestion:
      type: object
      description: A single question within a poll.
      properties:
        id:
          type: integer
          format: int64
        pollId:
          type: integer
          format: int64
        questionText:
          type: string
        order:
          type: integer
        isMandatory:
          type: boolean
        allowMultiple:
          type: boolean
        allowedAnswersCount:
          type: integer
        answerType:
          type: string
          enum: [text, media]
        assetType:
          type: string
          nullable: true
        mediaId:
          type: integer
          nullable: true
        photoId:
          type: integer
          nullable: true
        photo:
          $ref: '#/components/schemas/PollPhoto'
          nullable: true
          description: Question-level image (replaces legacy photoUrl).
        answers:
          type: array
          items:
            $ref: '#/components/schemas/PollAnswer'
      required:
        - id
        - pollId
        - questionText
        - order
        - isMandatory
        - allowMultiple
        - allowedAnswersCount
        - answerType
        - answers

    PollAnswer:
      type: object
      description: An answer option for a poll question.
      properties:
        id:
          type: integer
          format: int64
        questionId:
          type: integer
          format: int64
        type:
          type: string
          enum: [text, media]
        text:
          type: string
        mediaId:
          type: integer
          nullable: true
        order:
          type: integer
        isCorrect:
          type: boolean
        linkUrl:
          type: string
          nullable: true
        count:
          type: integer
          description: Vote count for this answer (in results or pre-aggregated).
        percentage:
          type: number
          format: float
          description: Vote percentage for this answer (in results or pre-aggregated).
        photo:
          $ref: '#/components/schemas/PollPhoto'
          nullable: true
          description: Answer-level image (replaces legacy photoUrl).
      required:
        - id
        - questionId
        - type
        - order
        - isCorrect

    PollResponse:
      type: object
      description: Envelope for a single poll.
      properties:
        message:
          type: string
        status:
          type: string
        data:
          $ref: '#/components/schemas/Poll'
      required:
        - status
        - data

    PollResultsResponse:
      type: object
      description: |
        Vote submission and poll results response.
        Returns the full poll with questions and answers; each answer includes
        count and percentage for results display.
      properties:
        message:
          type: string
        status:
          type: string
        data:
          $ref: '#/components/schemas/Poll'
          description: Full poll with questions and answers (each answer has count, percentage, photo).
      required:
        - status
        - data

    PollVoteEntry:
      type: object
      description: Single answer selection within a vote payload.
      properties:
        questionId:
          type: integer
          format: int64
        answerId:
          type: integer
          format: int64
      required:
        - questionId
        - answerId

    PollVotePayload:
      type: object
      description: Payload for submitting a vote to a poll.
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/PollVoteEntry'
      required:
        - answers

    RadioArchiveResponse:
      type: object
