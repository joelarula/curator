          required:
            - results
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/ApiSearchResultItem'

    ApiSearchResultItem:
      type: object
      required:
        - id
        - heading
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        heading:
          type: string
        photo:
          type: string
        url:
          type: string
        primaryCategory:
          type: integer
        state:
          type: integer
        type:
          type: string
          description: Content type (e.g. episode, series, clip, content).
        combinedTime:
          type: integer
          description: Sort key combining publish/update time.

    HelpFaqResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/HelpFaqData'

    HelpFaqData:
      type: object
      description: Wrapper object for FAQ entries.
      required:
        - items
      properties:
        items:
          type: array
          minItems: 2
          maxItems: 2
          description: Exactly two language sets, one `et` and one `ru`.
          items:
            $ref: '#/components/schemas/HelpFaqLanguageSet'

    HelpFaqLanguageSet:
      type: object
      description: FAQ questions for one site language.
      required:
        - lang
        - questions
      properties:
        lang:
          type: string
          enum:
            - et
            - ru
        questions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HelpFaqItem'

    HelpFaqItem:
      type: object
      required:
        - question
        - answers
      properties:
        question:
          type: string
          minLength: 1
        answers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1

    HelpFeedbackSubmitPayload:
      type: object
      required:
        - name
        - email
        - description
      properties:
        name:
          type: string
          description: Submitter name.
          maxLength: 64
        email:
          type: string
          format: email
          description: Submitter email address.
        description:
          type: string
          description: User-provided feedback / issue description.
          maxLength: 2000
        inOtherDevice:
          type: boolean
          description: Whether the issue was reproduced on another device.
