    ChannelsListResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: Human-readable message for the channels response.
          example: Channels
        data:
          type: object
          required:
            - channels
          properties:
            channels:
              type: array
              items:
                $ref: '#/components/schemas/Channel'

    ChannelDetailResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: Human-readable message for the single channel response.
          example: Channel
        data:
          $ref: '#/components/schemas/Channel'

    MenuResponse:
      type: object
      description: Envelope for channel/category menu items.
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: Human-readable message for the menu response.
          example: Menu
        data:
          type: object
          required:
            - items
          properties:
            items:
              type: array
              description: Menu items configured under the requested menu id.
              items:
                $ref: '#/components/schemas/MenuItem'

    MenuItem:
      type: object
      required:
        - id
        - name
        - link
      properties:
        id:
          type: integer
          format: int32
          description: Menu item identifier.
          example: 1179
        name:
          type: string
          description: Menu item display label.
          example: Raadio 2
        link:
          type: string
          description: Link target, usually a channel slug.
          example: raadio2
        description:
          type: string
          nullable: true
          description: Optional menu item description.
          example: ''

    Channel:
      type: object
      required:
        - nameId
        - title
        - url
        - media
      properties:
        nameId:
          type: string
          description: Unique identifier of the channel (slug).
          example: vikerraadio
        title:
          type: string
          description: Human-readable channel title.
          example: Vikerraadio
        url:
          type: string
          description: Public URL path of the channel.
          example: /vikerraadio
        categoryId:
          type: string
          nullable: true
          description: Root category id associated with this channel, if any.
          example: '404'
        channelTint:
          type: string
          nullable: true
          description: Primary UI tint color in hex format.
          example: '#21ACA8'
        darkTint:
          type: string
          nullable: true
          description: Optional dark tint color in hex format.
          example: '#101F76'
        lightTint:
          type: string
          nullable: true
          description: Optional light tint color in hex format.
          example: '#FF5778'
        shapeTint:
          type: string
          nullable: true
          description: Tint color for the logo shape in hex format.
          example: '#FFFFFF'
        external:
          type: boolean
          description: |
            When true, the channel is an external or partner stream (not a core ERR station).
            Clients should omit these from the main station carousel; they may still appear
            in other surfaces (e.g. deep links, category metadata).
          example: false
        isPlayable:
          type: boolean
          description: When false, clients hide the channel-card playback overlay.
          example: true
        gemiusId:
          type: string
          nullable: true
          description: Optional Gemius analytics identifier for the channel.
        email:
          type: string
          nullable: true
          format: email
          description: Optional public contact email for the channel page/footer.
          example: klassika@err.ee
        facebook:
          type: string
          nullable: true
          description: Optional public Facebook URL for the channel.
          example: https://www.facebook.com/klassikaraadio
        instagram:
          type: string
          nullable: true
          description: Optional public Instagram URL for the channel.
          example: https://www.instagram.com/klassikaraadio/
        twitter:
          type: string
          nullable: true
          description: Optional public X/Twitter URL for the channel.
          example: https://x.com/klassikaraadio
        telegram:
          type: string
          nullable: true
          description: Optional public Telegram URL for the channel.
          example: https://t.me/klassikaraadio
        aboutArticleId:
          type: number
          nullable: true
          description: Optional article id for the "Meist" nupp.
        menuId:
          type: integer
          format: int32
          nullable: true
          description: Optional menu id used by `GET /v1/getMenu/{menuId}`.
          example: 1167
        photoUrlBase:
          type: string
          nullable: true
          description: Base URL prefix for channel imagery, when provided by the API.
        media:
          $ref: '#/components/schemas/ChannelMedia'

    ChannelMedia:
      type: object
      required:
        - name
        - src
        - config
      properties:
        name:
          type: string
          description: Internal media name for the live stream.
          example: raadio2
        src:
          type: string
          description: HLS source URL for the live stream.
          example: //live.err.ee/live/raadio2.m3u8
        config:
          $ref: '#/components/schemas/ChannelMediaConfig'

    ChannelMediaConfig:
      type: object
      required:
        - live
        - mediaId
        - title
        - type
        - typologyName
      properties:
        live:
          type: boolean
          description: Indicates whether this media represents a live stream.
          example: true
        mediaId:
          type: string
          description: Media identifier for the live stream.
          example: RAADIO 2-live
        title:
          type: string
          description: Display title for the media.
          example: RAADIO 2
        type:
          type: string
          description: Media type.
          example: audio
        typologyName:
          type: string
          description: Typology identifier for the live stream.
          example: raadio2-live

    CountsByPrimaryCategory:
      type: object
      description: Map of primaryCategoryId -> count
      required: ["404", "405", "406", "407", "408"]
      properties:
        "404": { type: integer }
        "405": { type: integer }
        "406": { type: integer }
        "407": { type: integer }
        "408": { type: integer }

    CountsByType:
      type: object
      description: Map of type -> count
      required: ["clip", "content", "episode", "series"]
      properties:
        "clip": { type: integer }
        "content": { type: integer }
        "episode": { type: integer }
        "series": { type: integer }

    ApiRdsResponse:
      type: object
      description: Envelope for the live RDS response across all channels.
      required:
        - status
        - message
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Rds
        data:
          type: object
          description: Wrapper object for the live RDS rows.
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ApiRdsItem'

    ApiRdsItem:
      type: object
      description: Live RDS row for a single channel.
      required:
        - artist
        - channelNameId
        - endTime
        - primaryCategoryId
        - program
        - programName
        - programName2
        - rds
        - seriesName
        - startTime
        - title
      properties:
        artist:
          type: string
          description: Artist or primary performer name from the live metadata.
          example: ALESSI ROSE
        channelNameId:
          type: string
          description: Stable channel identifier used to join the row to an Orpheus station.
          example: raadio2
        endTime:
          type: integer
          format: int64
          nullable: true
          description: End time of the current programme window as a Unix timestamp in seconds.
          example: 1770077053
        primaryCategoryId:
          type: integer
          nullable: true
          description: Primary category id associated with the channel or programme.
          example: 405
        program:
          type: string
          description: Current programme display label.
          example: R2 Draiv
        programName:
          type: string
          description: Primary programme name.
          example: R2 Draiv
        programName2:
          type: string
          description: Secondary programme name or presenter label.
          example: Pille-Riin Karro
        rds:
          type: string
          description: Full RDS line as emitted by the backend.
          example: ALESSI ROSE - First Original Thought
        seriesName:
          type: string
          description: Series name associated with the current item.
          example: Draiv
        startTime:
          type: integer
          format: int64
          nullable: true
          description: Start time of the current programme window as a Unix timestamp in seconds.
          example: 1770030253
        title:
          type: string
          description: Current title intended for UI display.
          example: First Original Thought
        rdsImage:
          type: string
          nullable: true
          description: Cover or promotional image URL for the current RDS row when provided by the backend.
          example: https://s.err.ee/images/example.jpg
        rdsPlaylist:
          type: array
          nullable: true
          description: |
            Recent playlist entries for the same channel, ordered from most recently
            played to older entries.
          items:
            $ref: '#/components/schemas/ApiRdsPlaylistItem'

    ApiRdsPlaylistItem:
      type: object
      description: Historical RDS playlist row for a single played item.
      required:
        - artist
        - playedAt
        - program
        - rds
        - rdsImage
        - title
      properties:
        artist:
          type: string
          description: Artist or primary performer name for the played item.
          example: Berliner Philharmoniker
        playedAt:
          type: string
          format: date-time
          description: ISO timestamp describing when the item was played.
          example: '2026-06-17T11:32:10+03:00'
        playedAtSecondsAgo:
          type: integer
          nullable: true
          description: How many seconds ago the playlist item started playing, relative to the current time.
          example: 135
        program:
          type: string
          description: Programme label associated with the played item.
          example: Klassikaraadio
        rds:
          type: string
          description: Full RDS line for the played item.
          example: L. van Beethoven - Sümfoonia nr.5 - Berliner Philharmoniker
        rdsImage:
          type: string
          description: Cover or promotional image URL/path for the playlist row.
          example: crop/2023/07/05/1987793h8084.png
        title:
          type: string
          description: Track title intended for UI display.
          example: L. van Beethoven - Sümfoonia nr.5

    ApiSearchResponse:
      type: object
      required:
        - status
        - countsByArchived
        - countsByPrimaryCategory
        - countsByType
        - currentPage
        - perPage
        - totalPages
        - totalCount
        - data
      properties:
        status:
          type: string
          example: success
        countsByArchived:
          type: integer
          example: 1
        countsByActive:
          type: integer
          description: Number of results matching the "active" (on-air) facet.
          example: 5969
        countsByPrimaryCategory:
          $ref: '#/components/schemas/CountsByPrimaryCategory'
        countsByType:
          $ref: '#/components/schemas/CountsByType'
        currentPage:
          type: integer
          example: 1
        perPage:
          type: integer
          example: 24
        totalPages:
          type: integer
          example: 5
        totalCount:
          type: integer
          example: 105
        data:
          type: object
          description: |
            Wrapper object for search results.
