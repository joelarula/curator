openapi: 3.0.3
info:
  title: Titan Orpheus Public API
  version: 1.0.1
  license:
    name: UNLICENSED
    url: https://www.err.ee
  description: |
    Orpheus API spec used to bootstrap code generation.

servers:
  - url: /api

# These endpoints are public; 
# explicitly declare no authentication to satisfy tooling.
security: []

paths:
  /v1/getFrontPage/{categoryId}:
    get:
      summary: getFrontPage
      description: |
        Returns the configured frontpage blocks for a given category.
        Used by the Orpheus frontpage and category pages to render dynamic blocks.
      operationId: getFrontPage
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
            example: 5174
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrontpageResponse'

  /v1/getSchedule/{channel}/{scheduleDay}:
    get:
      summary: getSchedule
      description: |
        Returns the daily schedule for a single radio channel.
        The `scheduleDay` parameter is the start of the schedule day as a Unix timestamp in seconds.
      operationId: getSchedule
      parameters:
        - name: channel
          in: path
          required: true
          description: Channel identifier (e.g. raadio2)
          schema:
            type: string
            example: raadio2
        - name: scheduleDay
          in: path
          required: true
          description: Start of the schedule day as Unix timestamp (seconds)
          schema:
            type: integer
            format: int64
            example: 1764885600
        - name: adjacentDays
          in: query
          required: false
          description: |
            Number of days before and after `scheduleDay` to include in the response.
            The live-block horizontal schedule sends `1`.
          schema:
            type: integer
            minimum: 0
            example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'

  /v1/getAllSchedule/{scheduleDay}:
    get:
      summary: getAllSchedule
      description: |
        Returns the daily schedule for all radio channels.
        The `scheduleDay` parameter is the start of the schedule day as a Unix timestamp in seconds.
      operationId: getAllSchedule
      parameters:
        - name: scheduleDay
          in: path
          required: true
          description: Start of the schedule day as Unix timestamp (seconds)
          schema:
            type: integer
            format: int64
            example: 1764885600
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'

  /v1/channels:
    get:
      summary: listChannels
      description: |
        Returns all radio channels and thematic streams available in Orpheus.
        Each channel includes live stream metadata and optional UI tint colors.
      operationId: listChannels
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelsListResponse'

  /v1/channels/{channelId}:
    get:
      summary: getChannel
      description: |
        Returns metadata for a single radio channel or thematic stream.
        Includes the configured live stream source and media configuration.
      operationId: getChannel
      parameters:
        - name: channelId
          in: path
          required: true
          description: Channel identifier (e.g. vikerraadio)
          schema:
            type: string
            example: vikerraadio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelDetailResponse'

  /v1/getMenu/{menuId}:
    get:
      summary: getMenu
      description: |
        Returns menu items configured for a channel/category menu id.
        Channel metadata exposes the related `menuId` used to request these items.
      operationId: getMenu
      parameters:
        - name: menuId
          in: path
          required: true
          description: Numeric menu identifier from channel metadata.
          schema:
            type: integer
            format: int32
            minimum: 1
            example: 1167
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'

  /v1/search/radio:
    get:
      summary: searchRadio
      description: |
        Public search endpoint for radio content.
        Supports filters such as query, primary categories, content types, and pagination, and returns a paginated result set.
      operationId: searchRadio
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
        - name: primaryCategoryIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: types
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSearchResponse'

  /v1/search/az:
    get:
      summary: searchAz
      description: |
        Public search endpoint in A–Z mode.
        Returns a paginated list of series and programmes grouped for A–Z navigation using the same response schema as `/v1/search/radio`.
      operationId: searchAz
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
        - name: primaryCategoryIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: types
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSearchResponse'

  /v1/polls/{pollId}:
    get:
      summary: getPoll
      description: |
        Returns a single poll with its questions and answers.
        Used by Orpheus and Admin to render poll widgets and previews.
      operationId: getPoll
      parameters:
        - name: pollId
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the poll.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResponse'

  /v1/polls/{pollId}/results:
    get:
      summary: getPollResults
      description: |
        Returns aggregated results for a single poll.
        Used to render poll results views for public pages and admin.
      operationId: getPollResults
      parameters:
        - name: pollId
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the poll.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResultsResponse'

  /v1/polls/{pollId}/vote:
    post:
      summary: submitPollVote
      description: |
        Submits a vote for the given poll.
        Returns the updated aggregated poll results.
      operationId: submitPollVote
      parameters:
        - name: pollId
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the poll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollVotePayload'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollResultsResponse'

  /v1/help/{helpId}:
    get:
      summary: getHelpFaq
      description: |
        Returns FAQ entries for the given `helpId` group.
        `data.items` is an array of exactly two language sets, `et` and `ru`.
        Each set has `lang` and `questions`. The client shows the set for the current site locale.
        Intended for rendering public help and FAQ pages in Orpheus.
      operationId: getHelpFaq
      parameters:
        - name: helpId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpFaqResponse'

  /v1/feedback:
    post:
      summary: submitHelpFeedback
      description: |
        Submits a help/feedback request from the public Help page.
        Accepts multipart form data with optional image attachments.
      operationId: submitHelpFeedback
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HelpFeedbackSubmitPayload'
      responses:
        '200':
          description: Feedback accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpFeedbackSubmitResponse'
        '400':
          description: Invalid request or backend processing error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpFeedbackGenericErrorResponse'
        '422':
          description: Validation failed for one or more submitted fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpFeedbackValidationErrorResponse'
        '500':
          description: Internal backend error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpFeedbackGenericErrorResponse'

  /v1/getRdsAll:
    get:
      summary: getRdsAll
      description: |
        Returns live RDS metadata for all radio channels and thematic streams.
        Each item describes the current on-air / now-playing state for a single channel.
      operationId: getRdsAll
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRdsResponse'

  /v1/getRds/{channelNameId}:
    get:
      summary: getRds
      description: |
        Returns live RDS metadata for a single radio channel or thematic stream.
        The response shape matches `getRdsAll`, but `data.items` contains only the
        entry for the requested `channelNameId` when available.

        The Orpheus web app drives live RDS from `getRdsAll` only; this route remains
        available for other API consumers and for possible future frontend use. Do not
        remove it from the spec unless the backend deprecates the endpoint.
      operationId: getRds
      parameters:
        - name: channelNameId
          in: path
          required: true
          description: Stable channel identifier, for example `raadio2`.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRdsResponse'

  /v1/radio/archive/{contentId}:
    get:
      summary: getRadioArchive
      description: |
        Returns the episode archive for a radio series, grouped by month for one year.
        Month headings are derived from `dateSeconds`. The `date` string is a legacy label.
      operationId: getRadioArchive
      parameters:
        - name: contentId
          in: path
          required: true
          description: Series content id, for example `1037793`.
          schema:
            type: integer
            format: int64
            example: 1037793
        - name: year
          in: query
          required: false
          description: Calendar year to load. Omitted, the API returns the latest year.
          schema:
            type: integer
            example: 2026
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RadioArchiveResponse'

components:
  schemas:
    FrontpageResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          description: |
            Wrapper object for frontpage blocks.
            The backend currently returns an object with a `blocks` array.
          required:
            - blocks
          properties:
            blocks:
              type: array
              description: List of configured frontpage blocks.
              items:
                $ref: '#/components/schemas/PageBlock'

    PageBlock:
      type: object
      required: [id, type]
      properties:
        id:
          type: integer
        type:
          type: string
          description: |
            Backend block type discriminator.
            Known values currently include `list`, `timeline`, `media`, `live`,
            `banner`, `poll`, `article`, `channels`, and the string-list based
            `recents` / legacy `rdsplaylist` variants.
        heading:
          type: string
        order:
          type: integer
        settings:
          type: object
          properties:
            rowLimit:
              type: integer
              description: Preferred number of playlist items per rendered group/column.
            btnLink:
              type: string
              nullable: true
              description: Optional small heading link URL for list/playlist blocks.
            btnText:
              type: string
              nullable: true
              description: Optional small heading link label for list/playlist blocks.
            usageType:
              type: string
              nullable: true
              enum: [page, content]
              description: Controls where the block is rendered on series pages. Defaults to `page` when missing, null, or invalid.
            playlistSectionType:
              type: string
              nullable: true
              enum: [sameseries, default]
              description: |
                List/playlist section title mode. `sameseries` replaces the block heading
                with the localized “same series” title. `default`, missing, null, or any
                other value keeps the block heading.
            bannerType:
              type: string
              nullable: true
              enum: [grid, pager]
              description: Banner block display mode. `grid` renders a multi-item grid; `pager` renders a carousel.
            gridLayout:
              type: string
              nullable: true
              enum: ['1x1', '2x1', '3x1', '4x1', '1x2', '2x2', '3x2', '4x2']
              description: |
                Banner grid layout for `bannerType: grid`, expressed as `columns x rows`
                (for example `4x1` = four columns in one row). The UI renders at most
                `columns * rows` items from `items`.
              example: '4x1'
            autoScrollEnabled:
              type: boolean
              description: Enables automatic slide changes in pager mode.
            autoScrollDelaySeconds:
              type: number
              description: Delay between pager slides, in seconds.
            showPagerDots:
              type: boolean
              description: Shows pager navigation dots in pager mode.
            backgroundColor:
              type: string
              nullable: true
              description: Optional background colour for banner grid surface.
            widthPercent:
              type: number
              description: Banner section width relative to its container (1–100).
            itemAspectRatio:
              type: number
              nullable: true
              description: Shared pager slide aspect ratio (width / height), derived from the first pager image so slides do not jump while paging.
            playerVariant:
              type: string
              nullable: true
              enum: [standard, stylized]
              description: |
                Live block preview look. `standard` renders a solid background only;
                `stylized` adds the programme art as a fading backdrop plus a playback
                equalizer. Defaults to `stylized` when missing, null, or invalid.
            hideDate:
              type: boolean
              description: Hides the publish date line on timeline block cards. Defaults to `false`.
          additionalProperties: true
        items:
          description: |
            Normalized list of items for this block.
            In the current API, blocks expose their content via `items` instead of the older `data` field.
            Some block types such as `channels`, `recents`, and legacy `rdsplaylist`
            use simple channel slug strings here instead of object payloads.
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/FrontpageBlockItem'
              - type: string

    FrontpageBlockItem:
      type: object
      description: |
        Common content item payload used inside `data.blocks[].items[]` on the frontpage endpoint.
        The exact shape varies by block type, so this schema documents the known shared fields
        while still allowing additional backend-specific properties.
      additionalProperties: true
      properties:
        alt:
          type: string
          description: Optional explicit alt text for image-based blocks such as banners.
          example: Surnud luiged Meriväljal.
        id:
          oneOf:
            - type: integer
            - type: string
          description: Content identifier.
          example: 1609956223
        heading:
          type: string
          description: Content heading/title.
          example: Saja aasta laulud. 1958
        subheading:
          type: string
          description: Optional supporting text used by banner blocks.
          example: First supporting line
        metaText:
          type: string
          description: Optional metadata label used by banner blocks.
          example: More meta info
        hoverText:
          type: string
          description: Optional hover/expanded text used by banner blocks.
          example: Additional long hover description for this item.
        widthPercent:
          type: integer
          description: Optional grid width percentage used by banner items.
          example: 50
        combinedTime:
          type: integer
          format: int64
          description: Combined publish/sort timestamp in Unix seconds.
          example: 1773694800
        medias:
          type: array
          description: |
            Related media identifiers returned by the backend for this content item.
            The current API returns these ids as strings.
          items:
            type: string
          example: ['2453881']
        photo:
          $ref: '#/components/schemas/FrontpageBlockItemPhoto'
        channelCategoryId:
          type: integer
          description: Channel category identifier used to derive station/channel branding.
          example: 405
        primaryCategoryId:
          type: integer
          description: Primary category identifier associated with the content item.
          example: 404
        type:
          type: string
          description: Content type (for example `episode`, `series`, `clip`).
          example: episode
        url:
          type: string
          description: Public URL of the content item.
          example: /vikerraadio/1609956223/saja-aasta-laulud-1958
        durationText:
          type: string
          nullable: true
          description: |
            Preformatted media duration label for UI badges (e.g. "45m", "1h 23m").
            Null or missing values are normalized to an empty string by frontend adapters;
            empty string hides the badge.
          example: 45m

    FrontpageBlockItemPhoto:
      type: object
      description: Lightweight photo metadata returned inside frontpage block items.
      properties:
        id:
          type: integer
          example: 2165149
        photoUrlBase:
          type: string
          description: Relative crop path (to be prefixed with the photo host).
          example: crop/2023/11/27/2165149h837a.jpg
        w:
          type: integer
          description: Image width in pixels.
          example: 3000
        h:
          type: integer
          description: Image height in pixels.
          example: 2000
        captionEt:
          type: string
          example: I Wear* Experimenti kaksikkontsert
        captionEn:
          type: string
        captionRu:
          type: string
        authorEt:
          type: string
          example: Siim Lõvi /ERR
        authorEn:
          type: string
        authorRu:
          type: string

    ScheduleResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          description: Optional human-readable message from the backend.
          example: RadioSchedule
        data:
          type: object
          description: Wrapper object for schedule channels and their items.
          required:
            - channels
          properties:
            channels:
              type: array
              description: List of schedule buckets grouped by channel.
              items:
                $ref: '#/components/schemas/ScheduleChannelBucket'

    ScheduleChannelBucket:
      type: object
      description: Schedule items for a single channel and day.
      required:
        - nameId
        - items
      properties:
        nameId:
          type: string
          description: Channel identifier (e.g. vikerraadio).
          example: vikerraadio
        items:
          type: array
          description: Schedule items for this channel.
          items:
            $ref: '#/components/schemas/ScheduleItem'

    ScheduleItem:
      type: object
      required:
        - id
        - contentId
        - scheduleDay
        - startTime
        - endTime
        - durationTime
        - heading
        - lead
        - programName
        - url
        - mediaId
        - originalTime
        - periods
        - photo
        - radiomanId
        - rootCategoryId
      properties:
        id:
          type: integer
          description: Unique identifier of the schedule row.
        contentId:
          type: integer
          description: Content identifier associated with this schedule row.
        scheduleDay:
          type: integer
          format: int64
          description: Start of the schedule day as Unix timestamp (seconds).
          example: 1764885600
        startTime:
          type: integer
          format: int64
          description: Start time of the item as Unix timestamp (seconds).
          example: 1764905400
        endTime:
          type: integer
          format: int64
          description: End time of the item as Unix timestamp (seconds).
          example: 1764910860
        durationTime:
          type: string
          description: Duration in `HH:MM:SS` as returned by the backend.
          example: '00:30:00'
        heading:
          type: string
          description: Content heading.
          example: R2 Eelhommik
        lead:
          type: string
          description: Introductory text/lead from content.
          example: Contentist tulev sissejuhatus - 'lead'
        programName:
          type: string
          description: Program name from schedule table.
          example: R2 Eelhommik
        url:
          type: string
          description: Public URL of the content.
          example: /raadio2/1609864825/r2-eelhommik
        seriesName:
          type: string
          description: Series name associated with this schedule row.
          example: Raadio 2
        photoSquare:
          type: string
          description: Identifier for square crop used in some UIs (e.g. "category:405").
          example: category:405
        photoId:
          type: integer
          description: Photo identifier associated with this schedule item.
          example: 2160454
        photo:
          $ref: '#/components/schemas/PhotoData'
          description: Content image metadata.
        mediaData:
          type: array
          nullable: true
          description: Media list payload for this schedule item. May be null when no media exists.
          items:
            $ref: '#/components/schemas/ScheduleItemMedia'
        mediaId:
          type: integer
          description: Primary media identifier (matches an entry in `mediaData`).
          example: 2422643
        originalTime:
          type: integer
          format: int64
          description: Original airtime timestamp (seconds).
          example: 1767960300
        periods:
          type: array
          description: Publication periods for this schedule item.
          items:
            $ref: '#/components/schemas/ScheduleItemPeriod'
        rootCategoryId:
          type: integer
          description: Root category identifier (e.g. 405 for Raadio 2).
          example: 405
        radiomanId:
          type: integer
          description: Radioman identifier.
          example: 11846
        hideContent:
          type: boolean
          description: >
            When true, the linked content is unpublished. Schedule cards map this to
            isClickable false (the card body is not a link; playback stays available)
            and live-section read-more stays hidden.
          example: false

    PhotoData:
      type: object
      description: Photo metadata payload used by Orpheus APIs.
      required:
        - id
        - photoUrlBase
        - w
        - h
        - format
        - authorEn
        - authorEt
        - authorRu
        - captionEn
        - captionEt
        - captionRu
      properties:
        id:
          type: integer
          description: Photo identifier.
          example: 3149401
        photoUrlBase:
          type: string
          description: Relative crop path (to be prefixed with the photo host).
          example: crop/2026/01/09/3149401h88fa.jpg
        w:
          type: integer
          description: Image width in pixels.
          example: 3071
        h:
          type: integer
          description: Image height in pixels.
          example: 2048
        format:
          type: string
          description: Image format/extension.
          example: jpg
        authorEt:
          type: string
          example: Siim Lõvi /ERR
        authorEn:
          type: string
        authorRu:
          type: string
        captionEt:
          type: string
          example: 'Reedene intervjuu: Jaak Madison'
        captionEn:
          type: string
        captionRu:
          type: string

    ScheduleItemPeriod:
      type: object
      description: Publication period for a schedule item.
      required:
        - mediaId
        - publicStart
        - publicEnd
        - vodReqId
      properties:
        mediaId:
          type: integer
          example: 2422643
        publicStart:
          type: integer
          format: int64
          example: 1767964103
        publicEnd:
          type: integer
          format: int64
          example: 0
        vodReqId:
          type: integer
          example: 0

    ScheduleItemMedia:
      type: object
      description: Media payload attached to a schedule item.
      required:
        - id
        - type
        - headingEt
        - file
        - folder
        - mediaHash
        - created
        - downloadDisabled
        - embedDisabled
        - publicStart
        - publicEnd
        - photoId
        - radiomanId
        - restrictions
        - licenseServerUrl
        - src
        - periods
        - bodyEn
        - bodyEt
        - bodyRu
        - headingEn
        - headingRu
        - sourceEn
        - sourceEt
        - sourceRu
        - scheduleStart
      properties:
        id:
          type: integer
          example: 2422643
